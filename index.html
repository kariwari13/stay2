        {type:'multiple_choice',category:'ostanavlivatsya',question:'Такси ___ у подъезда (past tense)',options:['остановилось','осталось','стало','останавливалось'],correct:0,word:'останавливаться-остановиться'},
        {type:'translation_en_ru',category:'stanovitsya',question:'Translate: "She became a teacher"',answer:'она стала учителем',alternatives:['она стала учителем','она стала учительницей'],word:'становиться-стать'},
        {type:'translation_ru_en',category:'stanovitsya',question:'Переведите: "Я стану врачом"',answer:'i will become a doctor',alternatives:['i will become a doctor'],word:'становиться-стать'},
        {type:'multiple_choice',category:'stanovitsya',question:'___ темно (It became dark)',options:['Стало','Остало','Остановилось','Становилось'],correct:0,word:'становиться-стать'},
        {type:'fill_blanks',category:'stanovitsya',question:'Заполните: "Он ___ все лучше"',answer:'становится',hint:'(imperfective, present tense)',word:'становиться-стать'},
        {type:'translation_en_ru',category:'stanovitsya',question:'Translate: "The weather is getting colder"',answer:'погода становится холоднее',alternatives:['погода становится холоднее','становится холоднее'],word:'становиться-стать'},
        {type:'situational',category:'stanovitsya',question:'Ситуация: Ваш друг спрашивает о ваших планах на будущее. Вы хотите быть инженером.',context:'Расскажите о своей профессии в будущем',expectedElements:['стану','инженером'],word:'становиться-стать'},
        {type:'listening',category:'stanovitsya',question:'Прослушайте и повторите: "Стань на место!"',audio:'Стань на место!',word:'становиться-стать'},
        {type:'multiple_choice',category:'stanovitsya',question:'Мой брат хочет ___ программистом',options:['стать','остаться','остановиться','становиться'],correct:0,word:'становиться-стать'},
        {type:'multiple_choice',category:'all',question:'Я хочу ___ дома и отдохнуть',options:['остаться','остановиться','стать'],correct:0,word:'mixed'},
        {type:'multiple_choice',category:'all',question:'Мы ___ в центре города, в гостинице',options:['остановились','остались','стали'],correct:0,word:'mixed'},
        {type:'multiple_choice',category:'all',question:'Он ___ известным актером',options:['стал','остался','остановился'],correct:0,word:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Машина ___ перед школой.',context:'The car stopped in front of the school',expectedElements:['остановилась'],word:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Дети ___ дома одни.',context:'The children remained home alone',expectedElements:['остались'],word:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Она ___ студенткой университета.',context:'She became a university student',expectedElements:['стала'],word:'mixed'}
    ];

    function generateRandomTask() {
        const filteredTasks = state.selectedCategory === 'all' 
            ? sampleTasks 
            : sampleTasks.filter(task => task.category === state.selectedCategory);
        
        state.currentTask = filteredTasks[Math.floor(Math.random() * filteredTasks.length)];
        state.userAnswer = '';
        state.showResult = null;
        render();
    }

    function checkAnswer() {
        if (!state.currentTask) return;
        
        let isCorrect = false;
        
        switch(state.currentTask.type) {
            case 'multiple_choice':
                isCorrect = parseInt(state.userAnswer) === state.currentTask.correct;
                break;
            case 'translation_ru_en':
            case 'translation_en_ru':
            case 'fill_blanks':
                const normalizedAnswer = state.userAnswer.toLowerCase().trim();
                if (state.currentTask.alternatives) {
                    isCorrect = state.currentTask.alternatives.some(alt => 
                        alt.toLowerCase() === normalizedAnswer
                    );
                } else {
                    isCorrect = normalizedAnswer === state.currentTask.answer.toLowerCase();
                }
                break;
            case 'situational':
                isCorrect = state.currentTask.expectedElements.some(element =>
                    state.userAnswer.toLowerCase().includes(element.toLowerCase())
                );
                break;
            default:
                isCorrect = true;
        }
        
        state.score.correct += isCorrect ? 1 : 0;
        state.score.total += 1;
        state.showResult = isCorrect;
        
        render();
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.7;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const setVoice = () => {
                const voices = window.speechSynthesis.getVoices();
                
                const preferredVoices = [
                    voices.find(voice => voice.name.toLowerCase().includes('google') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.name.toLowerCase().includes('microsoft') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.name.toLowerCase().includes('irina') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.name.toLowerCase().includes('pavel') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.lang === 'ru-RU'),
                    voices.find(voice => voice.lang.startsWith('ru'))
                ];
                
                const selectedVoice = preferredVoices.find(voice => voice !== undefined);
                
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
                
                try {
                    window.speechSynthesis.speak(utterance);
                } catch (error) {
                    console.error('Speech synthesis error:', error);
                }
            };
            
            if (window.speechSynthesis.getVoices().length > 0) {
                setVoice();
            } else {
                window.speechSynthesis.onvoiceschanged = () => {
                    setVoice();
                    window.speechSynthesis.onvoiceschanged = null;
                };
                
                setTimeout(() => {
                    if (window.speechSynthesis.getVoices().length === 0) {
                        window.speechSynthesis.speak(utterance);
                    }
                }, 1000);
            }
        }
    }

    function startRecording() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Ваш браузер не поддерживает распознавание речи. Попробуйте Chrome или Edge.');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        recognition.lang = 'ru-RU';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 3;
        
        recognition.onstart = () => {
            state.isRecording = true;
            state.userAnswer = 'Говорите...';
            render();
        };
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            state.userAnswer = transcript;
            state.isRecording = false;
            render();
            
            if (state.currentTask && state.currentTask.type === 'listening') {
                setTimeout(() => {
                    checkAnswer();
                }, 1000);
            }
        };
        
        recognition.onerror = (event) => {
            state.isRecording = false;
            
            let errorMessage = 'Ошибка распознавания речи. ';
            switch(event.error) {
                case 'no-speech':
                    errorMessage += 'Речь не обнаружена. Попробуйте говорить громче.';
                    break;
                case 'audio-capture':
                    errorMessage += 'Микрофон недоступен.';
                    break;
                case 'not-allowed':
                    errorMessage += 'Доступ к микрофону запрещён.';
                    break;
                default:
                    errorMessage += 'Попробуйте ещё раз.';
            }
            state.userAnswer = errorMessage;
            render();
        };
        
        recognition.onend = () => {
            state.isRecording = false;
            render();
        };
        
        recognition.start();
    }

    function render() {
        const root = document.getElementById('root');
        
        const html = `
            <div class="max-w-4xl mx-auto bg-gray-50 min-h-screen">

                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>

                        Оставаться vs Останавливаться vs Становиться

                    }">
                        <svg class="mx-auto mb-1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                        Задания
                    </button>
                    <button onclick="switchTab('vocabulary')" class="flex-1 p-4 text-center font-medium ${
                        state.activeTab === 'vocabulary'

                    }">

                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>

                    </button>
                </div>

                <div class="p-6">
                    ${state.activeTab === 'tasks' ? renderTasks() : renderVocabulary()}
                </div>
            </div>
        `;
        
        root.innerHTML = html;
    }

    function renderTasks() {
        if (!state.currentTask) return '<p>Загрузка...</p>';
        
        let html = `
            <div class="space-y-6">

                        state.selectedCategory === 'all' 
                            ? 'bg-blue-500 text-white' 
                            : 'bg-white border hover:bg-gray-50'
                    }">
                        Все категории
                    </button>
                    <button onclick="setCategory('ostavatsya')" class="px-4 py-2 rounded-lg ${
                        state.selectedCategory === 'ostavatsya' 
                            ? 'bg-blue-500 text-white' 
                            : 'bg-white border hover:bg-gray-50'
                    }">
                        🏠 Оставаться-остаться
                    </button>
                    <button onclick="setCategory('ostanavlivatsya')" class="px-4 py-2 rounded-lg ${
                        state.selectedCategory === 'ostanavlivatsya' 
                            ? 'bg-blue-500 text-white' 
                            : 'bg-white border hover:bg-gray-50'
                    }">
                        ⏸️ Останавливаться-остановиться
                    </button>
                    <button onclick="setCategory('stanovitsya')" class="px-4 py-2 rounded-lg ${
                        state.selectedCategory === 'stanovitsya' 
                            ? 'bg-blue-500 text-white' 
                            : 'bg-white border hover:bg-gray-50'
                    }">
                        ✨ Становиться-стать
                    </button>
                </div>

                <div class="bg-white rounded-lg p-6 shadow-sm border">
                    ${state.showResult !== null ? `
                        <div class="mb-4 p-4 rounded-lg flex items-center gap-2 ${
                            state.showResult 
                                ? 'bg-green-100 text-green-800' 
                                : 'bg-red-100 text-red-800'
                        }">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                ${state.showResult 
                                    ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22,4 12,14.01 9,11.01"></polyline>'
                                    : '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>'
                                }
                            </svg>
                            ${state.showResult ? 'Правильно!' : `Неправильно. Правильный ответ: ${state.currentTask.answer || 'см. варианты выше'}`}
                        </div>
                    ` : ''}
                    
                    ${renderTaskContent()}
                    
                    <div class="mt-6 flex gap-3">
                        ${state.showResult === null ? `
                            <button onclick="checkAnswer()" ${!state.userAnswer.trim() ? 'disabled' : ''} class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 disabled:bg-gray-400 disabled:cursor-not-allowed">
                                Проверить
                            </button>
                        ` : `
                            <button onclick="generateRandomTask()" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 flex items-center gap-2">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                    <path d="M3 3v5h5"></path>
                                </svg>
                                Следующее задание
                            </button>
                        `}
                        <button onclick="generateRandomTask()" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 flex items-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                            Новое задание
                        </button>
                    </div>
                </div>

                ${state.currentTask.word && vocabulary[state.currentTask.category]?.[state.currentTask.word] ? `
                    <div class="bg-blue-50 rounded-lg p-4">
                        <h3 class="font-semibold text-blue-800 mb-2">Изучаемое слово:</h3>
                        <div class="text-blue-700">
                            <p class="font-medium">${state.currentTask.word}</p>
                            <p class="text-sm">${vocabulary[state.currentTask.category][state.currentTask.word].forms}</p>
                        </div>
                    </div>
                ` : ''}
            </div>
        `;
        
        return html;
    }

    function renderTaskContent() {
        const task = state.currentTask;
        
        switch(task.type) {
            case 'multiple_choice':
                return `
                    <div class="space-y-4">
                        <p class="text-lg font-medium">${task.question}</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${task.options.map((option, index) => `
                                <button onclick="setAnswer('${index}')" class="p-3 border rounded-lg transition-colors ${
                                    state.userAnswer === index.toString()
                                        ? 'bg-blue-500 text-white'
                                        : 'bg-white hover:bg-gray-50'
                                }">
                                    ${option}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            
            case 'listening':
                return `
                    <div class="space-y-4">
                        <p class="text-lg font-medium">${task.question}</p>
                        <button onclick="speakText('${task.audio.replace(/'/g, "\\\'")}')" class="flex items-center gap-2 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            </svg>
                            Прослушать
                        </button>
                        <div class="flex items-center gap-2">
                            <button onclick="startRecording()" class="flex items-center gap-2 px-4 py-2 rounded-lg ${
                                state.isRecording 
                                    ? 'bg-red-500 hover:bg-red-600' 
                                    : 'bg-blue-500 hover:bg-blue-600'
                            } text-white">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    ${state.isRecording 
                                        ? '<line x1="2" y1="2" x2="22" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path>'
                                        : '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>'
                                    }
                                </svg>
                                ${state.isRecording ? 'Остановить' : 'Записать ответ'}
                            </button>
                        </div>
                    </div>
                `;
            
            case 'situational':
                return `
                    <div class="space-y-4">
                        <div class="bg-yellow-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-yellow-800">Ситуация:</h3>
                            <p class="text-yellow-700">${task.question}</p>
                            ${task.context ? `
                                <p class="text-sm text-yellow-600 mt-2">
                                    Контекст: ${task.context}
                                </p>
                            ` : ''}
                        </div>
                        <textarea oninput="setAnswer(this.value)" placeholder="Введите ваш ответ..." class="w-full p-3 border border-gray-300 rounded-lg" rows="3">${state.userAnswer}</textarea>
                    </div>
                `;
            
            default:
                return `
                    <div class="space-y-4">
                        <p class="text-lg font-medium">${task.question}</p>
                        ${task.hint ? `<p class="text-sm text-gray-600">${task.hint}</p>` : ''}
                        <input type="text" value="${state.userAnswer}" oninput="setAnswer(this.value)" onkeypress="if(event.key==='Enter')checkAnswer()" placeholder="Введите ваш ответ..." class="w-full p-3 border border-gray-300 rounded-lg">
                        <div class="flex gap-2">
                            <button onclick="startRecording()" class="flex items-center gap-2 px-4 py-2 rounded-lg ${
                                state.isRecording 
                                    ? 'bg-red-500 hover:bg-red-600' 
                                    : 'bg-blue-500 hover:bg-blue-600'
                            } text-white">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    ${state.isRecording 
                                        ? '<line x1="2" y1="2" x2="22" y2="22"></line>'
                                        : '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>'
                                    }
                                </svg>
                                Голосовой ответ
                            </button>
                        </div>
                    </div>
                `;
        }
    }

    function renderVocabulary() {
        return `
            <div class="space-y-6">
                ${Object.entries(vocabulary).map(([category, words]) => `
                    <div class="bg-white rounded-lg p-6 shadow-sm border">
                        <h3 class="text-xl font-semibold mb-4 text-blue-600">
                            ${category === 'ostavatsya' ? '🏠 Оставаться-остаться (to remain, to stay)' :
                              category === 'ostanavlivatsya' ? '⏸️ Останавливаться-остановиться (to stop)' : 
                              '✨ Становиться-стать (to become)'}
                        </h3>
                        <div class="grid gap-4">
                            ${Object.entries(words).map(([word, info]) => `
                                <div class="border-l-4 border-blue-200 pl-4">
                                    <div class="flex items-center justify-between">
                                        <h4 class="font-semibold text-lg">${word}</h4>
                                        <button onclick="speakText('${word}')" class="text-blue-500 hover:text-blue-700">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <p class="text-gray-600">${info.definition}</p>
                                    <div class="flex items-center gap-2 mt-2">
                                        <p class="text-green-700 flex-1">${info.example}</p>
                                        <button onclick="speakText('${info.example.split(' (')[0].replace(/'/g, "\\\'")}')" class="text-green-600 hover:text-green-800">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="mt-2">
                                        <p class="text-sm text-gray-500 mb-2">${info.forms}</p>
                                        <div class="space-y-1">
                                            ${info.phrases.map(phrase => `
                                                <div class="flex items-center gap-2">
                                                    <span class="text-sm text-blue-600">• ${phrase}</span>
                                                    <button onclick="speakText('${phrase.replace(/'/g, "\\\'")}')" class="text-blue-500 hover:text-blue-700">
                                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                                        </svg>
                                                    </button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    }

    function switchTab(tab) {
        state.activeTab = tab;
        render();
    }

    function setCategory(category) {
        state.selectedCategory = category;
        generateRandomTask();
    }

    function setAnswer(value) {
        state.userAnswer = value;
    }

    // Инициализация
    generateRandomTask();
</script>
