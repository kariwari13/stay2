    const tasks = [
        {type:'translation_en_ru',category:'ostavatsya',question:'Translate: "I will stay home today"',answer:'я останусь дома сегодня',alternatives:['я останусь дома сегодня','сегодня я останусь дома'],verb:'оставаться-остаться'},
        {type:'translation_ru_en',category:'ostavatsya',question:'Переведите: "Мы остались в Москве на месяц"',answer:'we stayed in moscow for a month',alternatives:['we stayed in moscow for a month','we remained in moscow for a month'],verb:'оставаться-остаться'},
        {type:'multiple_choice',category:'ostavatsya',question:'Я ___ дома вчера',options:['остался','остановился','стал','оставался'],correct:0,verb:'оставаться-остаться'},
        {type:'fill_blanks',category:'ostavatsya',question:'Заполните: "Он ___ работать после уроков"',answer:'остался',hint:'(perfective aspect, past tense)',verb:'оставаться-остаться'},
        {type:'translation_en_ru',category:'ostavatsya',question:'Translate: "Stay with me" (imperative)',answer:'останься со мной',alternatives:['останься со мной','оставайся со мной'],verb:'оставаться-остаться'},
        {type:'situational',category:'ostavatsya',question:'Ситуация: Ваш друг уезжает. Вы хотите, чтобы он остался. Что сказать?',context:'Выразите просьбу в императиве',expectedElements:['останься','оставайся'],verb:'оставаться-остаться'},
        {type:'listening',category:'ostavatsya',question:'Прослушайте и повторите: "Я оставался там всю неделю"',audio:'Я оставался там всю неделю',verb:'оставаться-остаться'},
        {type:'multiple_choice',category:'ostavatsya',question:'Завтра я ___ дома (future tense)',options:['останусь','остановлюсь','стану','буду оставаться'],correct:0,verb:'оставаться-остаться'},
        {type:'translation_en_ru',category:'ostanavlivatsya',question:'Translate: "The bus stopped at the traffic light"',answer:'автобус остановился на светофоре',alternatives:['автобус остановился на светофоре'],verb:'останавливаться-остановиться'},
        {type:'translation_ru_en',category:'ostanavlivatsya',question:'Переведите: "Где вы остановились?"',answer:'where are you staying',alternatives:['where are you staying','where did you stop'],verb:'останавливаться-остановиться'},
        {type:'multiple_choice',category:'ostanavlivatsya',question:'Мы ___ в отеле (staying at a hotel)',options:['остановились','остались','стали','останавливались'],correct:0,verb:'останавливаться-остановиться'},
        {type:'fill_blanks',category:'ostanavlivatsya',question:'Заполните: "___ машину!" (imperative)',answer:'останови',hint:'(stop the car!)',verb:'останавливаться-остановиться'},
        {type:'translation_en_ru',category:'ostanavlivatsya',question:'Translate: "Don\'t stop!" (imperative)',answer:'не останавливайся',alternatives:['не останавливайся','не останавливайтесь'],verb:'останавливаться-остановиться'},
        {type:'situational',category:'ostanavlivatsya',question:'Ситуация: Вы приехали в новый город. Друг спрашивает где вы живете. Что ответить?',context:'Вы в гостинице "Москва"',expectedElements:['остановился','остановилась','гостинице','отеле'],verb:'останавливаться-остановиться'},
        {type:'listening',category:'ostanavlivatsya',question:'Прослушайте и повторите: "Он остановился и посмотрел назад"',audio:'Он остановился и посмотрел назад',verb:'останавливаться-остановиться'},
        {type:'multiple_choice',category:'ostanavlivatsya',question:'Такси ___ у подъезда (past tense)',options:['остановилось','осталось','стало','останавливалось'],correct:0,verb:'останавливаться-остановиться'},
        {type:'translation_en_ru',category:'stanovitsya',question:'Translate: "She became a teacher"',answer:'она стала учителем',alternatives:['она стала учителем','она стала учительницей'],verb:'становиться-стать'},
        {type:'translation_ru_en',category:'stanovitsya',question:'Переведите: "Я стану врачом"',answer:'i will become a doctor',alternatives:['i will become a doctor'],verb:'становиться-стать'},
        {type:'multiple_choice',category:'stanovitsya',question:'___ темно (It became dark)',options:['Стало','Остало','Остановилось','Становилось'],correct:0,verb:'становиться-стать'},
        {type:'fill_blanks',category:'stanovitsya',question:'Заполните: "Он ___ все лучше"',answer:'становится',hint:'(imperfective, present tense)',verb:'становиться-стать'},
        {type:'translation_en_ru',category:'stanovitsya',question:'Translate: "The weather is getting colder"',answer:'погода становится холоднее',alternatives:['погода становится холоднее','становится холоднее'],verb:'становиться-стать'},
        {type:'situational',category:'stanovitsya',question:'Ситуация: Ваш друг спрашивает о ваших планах на будущее. Вы хотите быть инженером.',context:'Расскажите о своей профессии в будущем',expectedElements:['стану','инженером'],verb:'становиться-стать'},
        {type:'listening',category:'stanovitsya',question:'Прослушайте и повторите: "Стань на место!"',audio:'Стань на место!',verb:'становиться-стать'},
        {type:'multiple_choice',category:'stanovitsya',question:'Мой брат хочет ___ программистом',options:['стать','остаться','остановиться','становиться'],correct:0,verb:'становиться-стать'},
        {type:'multiple_choice',category:'all',question:'Я хочу ___ дома и отдохнуть',options:['остаться','остановиться','стать'],correct:0,verb:'mixed'},
        {type:'multiple_choice',category:'all',question:'Мы ___ в центре города, в гостинице',options:['остановились','остались','стали'],correct:0,verb:'mixed'},
        {type:'multiple_choice',category:'all',question:'Он ___ известным актером',options:['стал','остался','остановился'],correct:0,verb:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Машина ___ перед школой.',context:'The car stopped in front of the school',expectedElements:['остановилась'],verb:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Дети ___ дома одни.',context:'The children remained home alone',expectedElements:['остались'],verb:'mixed'},
        {type:'situational',category:'all',question:'Выберите правильный глагол: Она ___ студенткой университета.',context:'She became a university student',expectedElements:['стала'],verb:'mixed'}
    ];

    // State
    let state = {
        currentTask: null,
        userAnswer: '',
        showResult: null,
        score: { correct: 0, total: 0 },
        isRecording: false,
        activeTab: 'tasks',
        selectedCategory: 'all'
    };

    // Functions
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.7;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            const setVoice = () => {
                const voices = window.speechSynthesis.getVoices();
                const preferredVoices = [
                    voices.find(voice => voice.name.toLowerCase().includes('google') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.name.toLowerCase().includes('microsoft') && voice.lang.startsWith('ru')),
                    voices.find(voice => voice.lang === 'ru-RU'),
                    voices.find(voice => voice.lang.startsWith('ru'))
                ];
                const selectedVoice = preferredVoices.find(voice => voice !== undefined);
                if (selectedVoice) utterance.voice = selectedVoice;
                try { window.speechSynthesis.speak(utterance); } catch (error) { console.error(error); }
            };
            
            if (window.speechSynthesis.getVoices().length > 0) {
                setVoice();
            } else {
                window.speechSynthesis.onvoiceschanged = () => { setVoice(); window.speechSynthesis.onvoiceschanged = null; };
                setTimeout(() => { if (window.speechSynthesis.getVoices().length === 0) window.speechSynthesis.speak(utterance); }, 1000);
            }
        }
    }

    function startRecording() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Ваш браузер не поддерживает распознавание речи.');
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'ru-RU';
        recognition.continuous = false;
        recognition.interimResults = false;
        
        recognition.onstart = () => {
            state.isRecording = true;
            state.userAnswer = 'Говорите...';
            renderTask();
        };
        
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.trim();
            state.userAnswer = transcript;
            state.isRecording = false;
            renderTask();
        };
        
        recognition.onerror = () => {
            state.isRecording = false;
            state.userAnswer = 'Ошибка распознавания. Попробуйте снова.';
            renderTask();
        };
        
        recognition.onend = () => {
            state.isRecording = false;
        };
        
        recognition.start();
    }

    function generateRandomTask() {
        const filteredTasks = state.selectedCategory === 'all' ? tasks : tasks.filter(t => t.category === state.selectedCategory);
        state.currentTask = filteredTasks[Math.floor(Math.random() * filteredTasks.length)];
        state.userAnswer = '';
        state.showResult = null;
        renderTask();
    }

    function checkAnswer() {
        if (!state.currentTask) return;
        let isCorrect = false;
        
        switch(state.currentTask.type) {
            case 'multiple_choice':
                isCorrect = parseInt(state.userAnswer) === state.currentTask.correct;
                break;
            case 'translation_ru_en':
            case 'translation_en_ru':
            case 'fill_blanks':
                const normalized = state.userAnswer.toLowerCase().trim();
                if (state.currentTask.alternatives) {
                    isCorrect = state.currentTask.alternatives.some(alt => alt.toLowerCase() === normalized);
                } else {
                    isCorrect = normalized === state.currentTask.answer.toLowerCase();
                }
                break;
            case 'situational':
                isCorrect = state.currentTask.expectedElements.some(el => state.userAnswer.toLowerCase().includes(el.toLowerCase()));
                break;
            default:
                isCorrect = true;
        }
        
        state.score.correct += isCorrect ? 1 : 0;
        state.score.total += 1;
        state.showResult = isCorrect;
        
        updateScore();
        renderTask();
    }

    function updateScore() {
        document.getElementById('score-correct').textContent = state.score.correct;
        document.getElementById('score-total').textContent = state.score.total;
        document.getElementById('score-accuracy').textContent = state.score.total > 0 ? Math.round((state.score.correct / state.score.total) * 100) : 0;
    }

    function renderTask() {
        const container = document.getElementById('content-tasks');
        if (!state.currentTask) {
            container.innerHTML = '<p>Загрузка...</p>';
            return;
        }
        
        let taskHTML = '';
        
        // Categories
        taskHTML += `
            <div class="flex gap-2 flex-wrap mb-6">
                <button onclick="setCategory('all')" class="px-4 py-2 rounded-lg transition-colors ${state.selectedCategory === 'all' ? 'category-active' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
                    Все категории
                </button>
                <button onclick="setCategory('ostavatsya')" class="px-4 py-2 rounded-lg transition-colors ${state.selectedCategory === 'ostavatsya' ? 'category-active' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
                    🏠 Оставаться-остаться
                </button>
                <button onclick="setCategory('ostanavlivatsya')" class="px-4 py-2 rounded-lg transition-colors ${state.selectedCategory === 'ostanavlivatsya' ? 'category-active' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
                    ⏸️ Останавливаться-остановиться
                </button>
                <button onclick="setCategory('stanovitsya')" class="px-4 py-2 rounded-lg transition-colors ${state.selectedCategory === 'stanovitsya' ? 'category-active' : 'bg-white border border-gray-300 hover:bg-gray-50'}">
                    ✨ Становиться-стать
                </button>
            </div>
        `;
        
        // Task container
        taskHTML += '<div class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">';
        
        // Result
        if (state.showResult !== null) {
            taskHTML += `
                <div class="mb-4 p-4 rounded-lg flex items-center gap-2 ${state.showResult ? 'bg-green-100 text-green-800 border border-green-300' : 'bg-red-100 text-red-800 border border-red-300'}">
                    <span class="font-medium">${state.showResult ? 'Правильно! 🎉' : `Неправильно. Правильный ответ: ${state.currentTask.answer || 'см. варианты выше'}`}</span>
                </div>
            `;
        }
        
        // Question
        taskHTML += `<div class="space-y-4"><p class="text-lg font-medium">${state.currentTask.question}</p>`;
        
        if (state.currentTask.hint) {
            taskHTML += `<p class="text-sm text-gray-600">${state.currentTask.hint}</p>`;
        }
        
        // Task-specific content
        switch(state.currentTask.type) {
            case 'multiple_choice':
                state.currentTask.options.forEach((option, index) => {
                    taskHTML += `
                        <button onclick="setAnswer('${index}')" class="w-full p-3 border rounded-lg transition-colors text-left ${state.userAnswer === index.toString() ? 'option-selected' : 'bg-white hover:bg-gray-50 border-gray-300'}">
                            ${option}
                        </button>
                    `;
                });
                break;
                
            case 'listening':
                taskHTML += `
                    <button onclick="speakText('${state.currentTask.audio.replace(/'/g, "\\'")}')" class="flex items-center gap-2 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        Прослушать
                    </button>
                    <button onclick="startRecording()" class="flex items-center gap-2 px-4 py-2 rounded-lg ${state.isRecording ? 'bg-red-500' : 'bg-blue-500'} text-white hover:opacity-90">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        </svg>
                        ${state.isRecording ? 'Слушаю...' : 'Записать ответ'}
                    </button>
                    ${state.userAnswer && !state.isRecording ? `<div class="bg-gray-100 p-3 rounded-lg"><p class="text-sm text-gray-600">Ваш ответ:</p><p class="font-medium">${state.userAnswer}</p></div>` : ''}
                `;
                break;
                
            case 'situational':
                taskHTML += `
                    <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                        ${state.currentTask.context ? `<p class="text-sm text-yellow-600">${state.currentTask.context}</p>` : ''}
                    </div>
                    <textarea id="userAnswerInput" class="w-full p-3 border border-gray-300 rounded-lg" rows="3" placeholder="Введите ваш ответ...">${state.userAnswer}</textarea>
                `;
                break;
                
            default:
                taskHTML += `
                    <input type="text" id="userAnswerInput" value="${state.userAnswer}" placeholder="Введите ваш ответ..." class="w-full p-3 border border-gray-300 rounded-lg">
                    <button onclick="startRecording()" class="flex items-center gap-2 px-4 py-2 rounded-lg ${state.isRecording ? 'bg-red-500' : 'bg-blue-500'} text-white">
                        Голосовой ответ
                    </button>
                `;
        }
        
        taskHTML += '</div>';
        
        // Buttons
        taskHTML += `
            <div class="mt-6 flex gap-3">
                ${state.showResult === null ? 
                    `<button onclick="checkAnswer()" ${!state.userAnswer.trim() || state.isRecording ? 'disabled' : ''} class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 disabled:bg-gray-400 font-medium">Проверить</button>` :
                    `<button onclick="generateRandomTask()" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 font-medium">Следующее задание</button>`
                }
                <button onclick="generateRandomTask()" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600">Новое задание</button>
            </div>
        `;
        
        taskHTML += '</div>';
        
        // Verb info
        if (state.currentTask.verb) {
            taskHTML += `
                <div class="mt-6 bg-blue-50 rounded-lg p-4 border border-blue-200">
                    <h3 class="font-semibold text-blue-800 mb-2">Изучаемый глагол:</h3>
                    <p class="font-medium text-blue-700">${state.currentTask.verb}</p>
                </div>
            `;
        }
        
        container.innerHTML = taskHTML;
        
        // Add event listeners for inputs
        const input = document.getElementById('userAnswerInput');
        if (input) {
            input.addEventListener('input', (e) => {
                state.userAnswer = e.target.value;
            });
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkAnswer();
            });
        }
    }

    function renderVocabulary() {
        const container = document.getElementById('content-vocabulary');
        let html = '<div class="space-y-6">';
        
        Object.values(vocabulary).forEach(cat => {
            html += `
                <div class="bg-white rounded-lg p-6 shadow-sm border border-gray-200">
                    <h3 class="text-xl font-semibold mb-4 text-blue-600">${cat.title}</h3>
                    <div class="border-l-4 border-blue-200 pl-4">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="font-semibold text-lg">${cat.word}</h4>
                            <button onclick="speakText('${cat.word}')" class="text-blue-500 hover:text-blue-700">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>

                                </svg>
                            </button>
                        </div>
                        <p class="text-gray-700 mb-3">${cat.definition}</p>
                        <div class="mb-3">
                            <h5 class="font-medium text-sm text-gray-600 mb-2">Примеры:</h5>
                            <div class="space-y-2">
            `;
            
            cat.examples.forEach(ex => {
                const textOnly = ex.split(' (')[0];
                html += `
                    <div class="flex items-start gap-2">
                        <button onclick="speakText('${textOnly.replace(/'/g, "\\'")}')" class="text-green-600 hover:text-green-800 mt-1">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>
                        <p class="text-green-700">${ex}</p>
                    </div>
                `;
            });
            
            html += `
                            </div>
                        </div>
                        <div>
                            <h5 class="font-medium text-sm text-gray-600 mb-2">Часто используемые конструкции:</h5>
                            <div class="flex flex-wrap gap-2">
            `;
            
            cat.constructions.forEach(con => {
                const textOnly = con.split(' (')[0];
                html += `
                    <div class="flex items-center gap-1 bg-blue-50 px-3 py-1 rounded-full">
                        <span class="text-sm text-blue-700">${con}</span>
                        <button onclick="speakText('${textOnly.replace(/'/g, "\\'")}')" class="text-blue-500">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            </svg>
                        </button>
                    </div>
                `;
            });
            
            html += `
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        container.innerHTML = html;
    }

    function setCategory(category) {
        state.selectedCategory = category;
        generateRandomTask();
    }

    function setAnswer(value) {
        state.userAnswer = value;
        renderTask();
    }

    function switchTab(tab) {
        state.activeTab = tab;
        document.getElementById('tab-tasks').classList.toggle('tab-active', tab === 'tasks');
        document.getElementById('tab-vocabulary').classList.toggle('tab-active', tab === 'vocabulary');
        document.getElementById('tab-tasks').classList.toggle('text-gray-600', tab !== 'tasks');
        document.getElementById('tab-vocabulary').classList.toggle('text-gray-600', tab !== 'vocabulary');
        document.getElementById('content-tasks').style.display = tab === 'tasks' ? 'block' : 'none';
        document.getElementById('content-vocabulary').style.display = tab === 'vocabulary' ? 'block' : 'none';
    }

    // Event listeners
    document.getElementById('tab-tasks').addEventListener('click', () => switchTab('tasks'));
    document.getElementById('tab-vocabulary').addEventListener('click', () => switchTab('vocabulary'));

    // Initialize
    generateRandomTask();
    renderVocabulary();
</script>
